name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: >-
            username=sujaymalipatil&custom_title=Developer%20Metrics&show_icons=true&bg_color=00000000&title_color=ff2d4b&text_color=c9d1d9&icon_color=ff2d4b&border_color=30363d&border_radius=8

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: >-
            username=sujaymalipatil&layout=compact&langs_count=6&bg_color=00000000&title_color=ff2d4b&text_color=c9d1d9&border_color=30363d&border_radius=8

      - name: Pin RecommendMe API
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          path: profile/pin-recommendme.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: >-
            username=sujaymalipatil&repo=recommendme-api&bg_color=00000000&title_color=ff2d4b&text_color=c9d1d9&icon_color=ff2d4b&border_color=30363d&border_radius=8

      - name: Pin RecommendMe App
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          path: profile/pin-recommendme-app.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: >-
            username=sujaymalipatil&repo=recommendme-app&bg_color=00000000&title_color=ff2d4b&text_color=c9d1d9&icon_color=ff2d4b&border_color=30363d&border_radius=8

      - name: Pin AgriSens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          path: profile/pin-agrisens.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: >-
            username=sujaymalipatil&repo=AgriSens&bg_color=00000000&title_color=ff2d4b&text_color=c9d1d9&icon_color=ff2d4b&border_color=30363d&border_radius=8

      - name: Streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: >-
            user=sujaymalipatil&background=00000000&border=30363d&ring=ff2d4b&fire=ff2d4b&currStreakLabel=ff2d4b&sideLabels=c9d1d9&dates=8b949e&currStreakNum=ffffff&sideNums=ffffff&stroke=30363d&border_radius=8

      - name: Stamp last updated
        run: date -u +"%Y-%m-%d UTC" > profile/last-updated.txt

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet && echo "No card changes" && exit 0
          git commit -m "chore: refresh profile stats cards"
          git push
